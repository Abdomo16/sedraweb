services:
  db:
    image: postgres:17-alpine
    container_name: sedar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sedar
    ports:
      - "5432:5432"
    volumes:
      - sedar-db-data:/var/lib/postgresql/data

volumes:
  sedar-db-data:
